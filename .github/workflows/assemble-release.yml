name: Assemble release installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to assemble
        required: true
        default: v0.1.0-beta.1

permissions:
  contents: write

concurrency:
  group: assemble-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/assemble-release.py "$RELEASE_TAG"
