<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeRoam · 本地数据迁移</title><style>body{max-width:680px;margin:48px auto;padding:24px;font:16px/1.8 system-ui;background:#f4f7f1;color:#263b30}button,input{font:inherit;margin:12px 8px 12px 0;padding:10px}a{color:#286044}pre{white-space:pre-wrap}</style><h1>WeRoam · 本地数据迁移</h1><p>不同浏览器、主机名和端口的数据相互独立。请在有数据的浏览器和地址导出，再到目标浏览器的这个页面导入。</p><p>包含本地朋友、消息、图片、工坊和演示收件箱；不含桌面邮箱凭据、真实邮件及服务端生成模型文件。请妥善保存备份。迁移时请关闭其他 WeRoam 页面。</p><p id="origin"></p><button id="export">导出本地数据</button><hr><input id="file" type="file" accept="application/json,.json"><button id="import">导入到此浏览器</button><p>导入只允许目标数据库为空；已有数据时不会覆盖，请先备份或使用新的浏览器配置。</p><pre id="status" role="status"></pre><a href="/">返回 WeRoam</a><script type="module" src="src/platform/data-transfer.js"></script></html>
