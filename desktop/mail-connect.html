<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>连接 QQ 邮箱 · WeRoam</title><link rel="stylesheet" href="mail-connect.css"></head>
<body><main><small>WeRoam · Universal Inbox</small><h1>连接邮箱</h1><p>用真实邮件体验统一收件箱。</p>
<form id="mail-form"><label>邮箱类型<select name="provider"><option value="qqmail">QQ 邮箱</option><option value="netease">网易 163 邮箱</option></select></label>
<ol><li id="mail-setup">在邮箱网页版进入设置</li><li>开启 <b>IMAP/SMTP 服务</b>并生成授权码</li><li>填写邮箱和授权码，开始收取</li></ol>
<label>邮箱地址<input name="account" type="email" placeholder="123456@qq.com" maxlength="72" autocomplete="off" required></label><label>客户端授权码<input name="code" type="password" maxlength="128" autocomplete="new-password" spellcheck="false" required placeholder="不是邮箱登录密码"></label><label class="consent"><input name="consent" type="checkbox" required> 允许读取收件箱，并在本机加密保存</label><button type="submit">连接并收取</button></form>
<p id="status" role="status" aria-live="polite"></p><button id="done" hidden>返回收件箱</button>
<footer>最近 7 天 · 最多 200 封 · 只读 · 不下载附件<br>授权码可能具有读写权限，WeRoam 本版只执行读取。断开后请另到对应邮箱撤销授权码。</footer></main><script src="mail-connect.js"></script></body></html>
