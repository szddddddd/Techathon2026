<!doctype html><html lang="zh-CN"><head><base href="../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>好友骨骼与动作检查</title><link rel="stylesheet" href="src/styles/rig-review.css"></head><body><aside id="tools"><h1>好友动作检查</h1><label>角色<select id="animal"><option value="kangaroo">袋鼠</option><option value="fox">狐狸</option><option value="rabbit">兔子</option><option value="bear">熊</option></select></label><label>本地 GLB<input id="model-file" type="file" accept=".glb"></label><label>状态<select id="state"><option value="">待机</option><option value="walk">行走</option><option value="happy">开心</option><option value="emo">emo</option><option value="tired">疲惫</option><option value="busy">忙碌</option><option value="relax">摸鱼</option><option value="music">听歌</option><option value="exercise">运动</option><option value="travel">旅行</option></select></label><div class="row"><button id="front">正面</button><button id="side">侧面</button><button id="back">背面</button></div><label>播放速度<input id="speed" type="range" min="0" max="1" step=".1" value="1"></label><label><input id="bones" type="checkbox">显示骨骼</label><label><input id="contacts" type="checkbox" checked>显示接地点</label><label><input id="static" type="checkbox">减少动态效果</label><details><summary>绑定校正</summary><p>关节坐标按角色身高归一化。先暂停，再编辑、重绑并检查所有状态。</p><label>关节<select id="joint"></select></label><div class="row" id="joint-coordinates"><input aria-label="关节 X" id="joint-x" type="number" step=".005"><input aria-label="关节 Y" id="joint-y" type="number" step=".005"><input aria-label="关节 Z" id="joint-z" type="number" step=".005"></div><button id="rebind">应用关节并重绑</button><label>权重覆盖 JSON<textarea id="weights" rows="4" placeholder='[{"mesh":0,"vertex":0,"joints":["hips"],"weights":[1]}]'></textarea></label><button id="apply-weights">应用权重</button><button id="export-rig">导出校正配置</button><label>导入校正配置<input id="import-rig" type="file" accept=".json"></label><button id="save-rig">保存到本机绑定缓存</button></details><p id="status" role="status">正在加载模型…</p><pre id="diagnostics"></pre></aside><main id="stage"></main><script src="dist/rig-review.js"></script></body></html>
